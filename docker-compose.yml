version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bank-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bankdb
    ports:
      - "3306:3306"
    volumes:
      - ./sql/01_init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql

  app:
    build: .
    container_name: bank-tomcat
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
